# =============================================================================
# CRITICAL BUGS FOUND
# =============================================================================

critical_bugs:
  - bug_id: "S6-S3-AC4-CRITICAL-001"
    title: "Form Submission Fails - Temperature Field Converts Empty to Invalid 0"
    severity: "P0 (Critical)"
    status: "IDENTIFIED - Root Cause Found"

    description: |
      Medical check-in form submission fails 100% of the time. When temperature
      field is left blank (as intended for AC1 optional temperature), the frontend
      sends empty string "", backend converts it to 0, which is invalid.

    impact:
      user_impact: "Medical Incharge CANNOT create any check-ins - complete system failure"
      testing_impact: "Blocks ALL 39 test cases - cannot proceed with QA"
      business_impact: "Sprint 6 Story 3 cannot be released - critical functionality broken"

    root_cause:
      frontend: |
        File: frontend/src/components/dashboard/medicalIncharge.js:293
        Code: formDataToSend.append("temperature", formData.temperature);
        Issue: Sends empty string "" when field is blank

      backend: |
        File: backend/services/medicalCheckIns.js:26
        Code: this.temperature = obj.temperature || 0;
        Issue: Converts empty string to 0 (invalid temperature value)

    test_evidence:
      - test_case: "TC-AC1-TEMP-001: Submit WITHOUT temperature"
        expected: "Form submits successfully (temperature optional)"
        actual: "400 Bad Request, no check-in created"
        screenshot: "S3-AC1-TEMP-001-FAILED-silent-error.png"

      - test_case: "TC-AC1-TEMP-002: Submit WITH temperature (37.5°C)"
        expected: "Form submits successfully"
        actual: "500 Internal Server Error, no check-in created"
        screenshot: "S3-AC1-TEMP-002-after-submit-WITH-temp.png"

    reproduction_rate: "100% (2/2 submissions failed)"

    proposed_fix: |
      OPTION 1 (Backend - RECOMMENDED):
      File: backend/services/medicalCheckIns.js:26
      Change: this.temperature = obj.temperature || 0;
      To: this.temperature = obj.temperature && obj.temperature !== "" ? Number(obj.temperature) : null;

      OPTION 2 (Frontend):
      File: frontend/src/components/dashboard/medicalIncharge.js:293
      Change: formDataToSend.append("temperature", formData.temperature);
      To: if (formData.temperature && formData.temperature !== "") {
            formDataToSend.append("temperature", formData.temperature);
          }

      OPTION 3 (Both - BEST): Apply both fixes for defense-in-depth

    verification_required:
      - "Re-run TC-AC1-TEMP-001 (submit WITHOUT temperature)"
      - "Re-run TC-AC1-TEMP-002 (submit WITH temperature 37.5°C)"
      - "Verify check-in created in database"
      - "Verify success toast displayed"
      - "Proceed with remaining 37 test cases"

