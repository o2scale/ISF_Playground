# BUG FIX VERIFICATION
# =============================================================================

critical_bugs_fixed:
  - bug_id: "S6-S3-AC4-CRITICAL-001"
    title: "Temperature Field Converts Empty to Invalid 0"
    status: "✅ FIXED & VERIFIED"
    fix_date: "2025-11-12 10:20:13"
    verification_date: "2025-11-12 10:46:07"

    original_issue: |
      Backend converted empty temperature string "" to invalid value 0,
      causing form submission to fail with 400 Bad Request.

    fix_applied: |
      File: backend/services/medicalCheckIns.js:26-27
      Code: this.temperature = obj.temperature && obj.temperature !== "" ? Number(obj.temperature) : null;

    verification_tests:
      - test: "TC-AC1-TEMP-001: Submit WITHOUT temperature"
        result: "✅ PASS"
        evidence: "Check-in created successfully (vishnu, 12 Nov 2025, 10:41 am)"
        database_value: "temperature: null"

      - test: "TC-AC1-TEMP-002: Submit WITH temperature (37.5°C)"
        result: "✅ PASS"
        evidence: "Check-in created successfully (Devstd, 12 Nov 2025, 10:41 am)"
        database_value: "temperature: 37.5"

  - bug_id: "S6-S3-NEW-BUG-001"
    title: "Health Status Case Mismatch (Normal vs normal)"
    status: "✅ FIXED & VERIFIED"
    fix_date: "2025-11-12 10:37:08"
    verification_date: "2025-11-12 10:46:07"

    original_issue: |
      Frontend sent capitalized health status values ("Normal", "Important", "Critical")
      but database enum expected lowercase ("normal", "important", "critical"),
      causing 500 Internal Server Error with validation failure.

    fix_applied: |
      File: backend/services/medicalCheckIns.js:29-30
      Code: this.healthStatus = obj.healthStatus ? obj.healthStatus.toLowerCase() : "normal";

    verification_tests:
      - test: "All AC1 tests with various health status values"
        result: "✅ PASS"
        values_tested:
          - "Important" → "important" (TC-AC1-TEMP-001)
          - "Normal" → "normal" (TC-AC1-TEMP-002)
          - "Critical" → "critical" (TC-AC1-TEMP-003)

  - bug_id: "S6-S3-NEW-BUG-002"
    title: "Symptoms Double-Stringification Issue"
    status: "✅ FIXED & VERIFIED"
    fix_date: "2025-11-12 10:37:08"
    verification_date: "2025-11-12 10:46:07"

    original_issue: |
      Frontend used JSON.stringify() on symptoms array, sending "[\"fever\"]" (string)
      instead of "fever" (array value), causing enum validation to fail with 500 error.

    fix_applied: |
      File: frontend/src/components/dashboard/medicalIncharge.js:299-304
      Code: Removed JSON.stringify, now sends each symptom as array element via FormData

    verification_tests:
      - test: "All AC1 tests with various symptoms"
        result: "✅ PASS"
        symptoms_tested:
          - "Fever" (TC-AC1-TEMP-001)
          - "Cough + Cold" (TC-AC1-TEMP-002)
          - "Stomach ache" (TC-AC1-TEMP-003)
          - "Headache" (TC-AC1-TEMP-004)

