# Known Issues / Blockers
known_issues:
  - issue_id: 'BUG-001'
    severity: 'P0 - Blocker'
    title: 'QuizBuilder component crashes on page load - Data contract mismatch'
    description: 'Course API endpoint returns {success: true, data: [...]} but frontend QuizBuilder.jsx line 104 expects response.data.courses, resulting in setCourses(undefined). When component renders, courses.map() crashes with "Cannot read properties of undefined (reading ''map'')".'
    location: 'frontend/src/pages/admin/QuizBuilder.jsx:100-108, backend/controllers/lms/admin/courseController.js:39-43'
    steps_to_reproduce:
      - 'Navigate to http://localhost:3000/admin/quizzes'
      - 'Click "Create New Quiz" button'
      - 'Component crashes immediately with TypeError'
    expected_behavior: 'QuizBuilder should load successfully, courses dropdown should populate from API response'
    actual_behavior: 'Component crashes with "Cannot read properties of undefined (reading ''map'')" error'
    fix_required: 'Change courseController.js line 42 from "data: coursesWithCounts" to "courses: coursesWithCounts" OR change QuizBuilder.jsx line 104 from "response.data.courses" to "response.data.data"'
    blocks_test_cases: 'ALL - TC 1.1 through TC 11.6 (72 total test cases blocked)'
    discovered_by: 'QA Agent (Quinn)'
    discovered_date: '2025-10-26 21:10:47'
    status: 'fixed'
    fixed_date: '2025-10-26 21:20:06'
    fixed_by: 'Dev Agent (James)'

  - issue_id: 'BUG-002'
    severity: 'P0 - Blocker'
    title: 'Missing API endpoint: GET /api/v2/lms/admin/courses/:courseId/modules'
    description: 'QuizBuilder.jsx line 113 attempts to fetch modules for a course via GET /api/v2/lms/admin/courses/${courseId}/modules but this endpoint does not exist in backend routes. Only POST route exists for adding modules.'
    location: 'frontend/src/pages/admin/QuizBuilder.jsx:111-120, backend/routes/v2/lms/admin/courses.js (missing endpoint)'
    expected_behavior: 'API should return list of modules for the specified course: {success: true, modules: [...]}'
    actual_behavior: '404 Not Found - endpoint does not exist'
    fix_required: 'Implement GET /api/v2/lms/admin/courses/:courseId/modules endpoint in courseController and register route'
    blocks_test_cases: 'TC 1.5 (Associate Quiz with Course Chapter), all quiz creation tests requiring course association'
    discovered_by: 'QA Agent (Quinn)'
    discovered_date: '2025-10-26 21:10:47'
    status: 'fixed'
    fixed_date: '2025-10-26 21:20:06'
    fixed_by: 'Dev Agent (James)'
    fix_details: 'Added getModulesByCourseId() method in courseController.js:718-740, registered GET route in courses.js:75-80'

  - issue_id: 'BUG-003'
    severity: 'P0 - Blocker'
    title: 'Missing API endpoint: GET /api/v2/lms/admin/modules/:moduleId/chapters'
    description: 'QuizBuilder.jsx line 124 attempts to fetch chapters for a module via GET /api/v2/lms/admin/modules/${moduleId}/chapters but this endpoint does not exist. Only POST route exists for adding chapters.'
    location: 'frontend/src/pages/admin/QuizBuilder.jsx:122-131, backend routes (missing endpoint)'
    expected_behavior: 'API should return list of chapters for the specified module: {success: true, chapters: [...]}'
    actual_behavior: '404 Not Found - endpoint does not exist'
    fix_required: 'Implement GET /api/v2/lms/admin/modules/:moduleId/chapters endpoint and register route'
    blocks_test_cases: 'TC 1.5 (Associate Quiz with Course Chapter), all quiz creation tests requiring course association'
    discovered_by: 'QA Agent (Quinn)'
    discovered_date: '2025-10-26 21:10:47'
    status: 'fixed'
    fixed_date: '2025-10-26 21:20:06'
    fixed_by: 'Dev Agent (James)'
    fix_details: 'Created backend/routes/v2/lms/admin/modules.js (19 lines), added getChaptersByModuleId() in courseController.js:746-774, registered module routes in server.js'

  - issue_id: 'BUG-004'
    severity: 'P0 - Blocker'
    title: 'Quiz creation fails with 500 Internal Server Error - createdBy field issue'
    description: 'QuizBuilder allows user to enter title and description, but clicking "Save Draft" fails with 500 error and toast "Failed to create quiz". Quiz model requires createdBy field (Quiz.js:210-215), controller sets createdBy: req.user._id (quizController.js:184), but req.user._id appears to be undefined/invalid causing Mongoose validation to fail. Root cause: Empty strings for optional course/module/chapter fields caused Mongoose ObjectId cast failures.'
    location: 'backend/controllers/quizController.js:170-181, backend/models/Quiz.js:210-215'
    steps_to_reproduce:
      - 'Navigate to http://localhost:3000/admin/quizzes'
      - 'Click "Create New Quiz"'
      - 'Enter title: "File Management Basics Test"'
      - 'Enter description: "Test your knowledge of file management"'
      - 'Click "Save Draft"'
      - 'Error toast appears: "Failed to create quiz"'
      - 'Browser console shows: 500 Internal Server Error'
    expected_behavior: 'Quiz should save as draft, redirect to quiz list or stay on page with success message'
    actual_behavior: '500 Internal Server Error, quiz not created in database, error toast displayed'
    fix_required: 'Convert empty strings to undefined for optional ObjectId fields (course, module, chapter) before Quiz creation'
    fix_applied: 'quizController.js:170-181 - Added cleanedCourse/cleanedModule/cleanedChapter sanitization: empty strings converted to undefined'
    blocks_test_cases: 'ALL - TC 1.1 through TC 11.6 (72 total test cases blocked - cannot create quiz)'
    discovered_by: 'QA Agent (Quinn)'
    discovered_date: '2025-10-26 21:24:59'
    status: 'fixed'
    fixed_date: '2025-10-26 21:45:00'
    fixed_by: 'Dev Agent (James)'

  - issue_id: 'BUG-005'
    severity: 'P0 - Blocker'
    title: 'Quiz update fails with 500 Internal Server Error - Complex root cause (3 fixes required)'
    description: 'After creating quiz successfully, attempting to update quiz with course/module/chapter associations failed with 500 error. Both "Save Draft" and "Publish Quiz" buttons triggered PUT /api/v2/lms/admin/quizzes/:quizId returning 500 Internal Server Error. Error toast: "Failed to update quiz". ACTUAL ROOT CAUSE (discovered via console logs): Invalid Mongoose populate calls for module and chapter (subdocuments, not separate models). Required 3 separate fixes to fully resolve.'
    location: 'backend/controllers/quizController.js:240-299 (updateQuiz function) and 4 other controller functions'
    steps_to_reproduce:
      - 'Create quiz: "File Management Basics Test" with 3 questions (working after BUG-004 fix)'
      - 'In Quiz Builder, select Course: "Test Course - QA Verification (Edited) (Copy)"'
      - 'Select Module: "Module 1: Getting Started"'
      - 'Select Chapter: "Chapter 1: Introduction"'
      - 'Click "Save Draft" or "Publish Quiz"'
      - 'Error toast appears: "Failed to update quiz"'
      - 'Browser console shows: 500 Internal Server Error, AxiosError'
    expected_behavior: 'Quiz should update with course/module/chapter associations, save successfully, and publish if requested'
    actual_behavior: '500 Internal Server Error, quiz not updated, error toast displayed'
    fix_applied_part_a: 'Line 283 - Changed "quiz.lastEditedBy = req.user._id" to "quiz.lastEditedBy = req.user?._id || req.user?.id" (deployed 2025-10-26 22:31:45)'
    fix_applied_part_b: 'Lines 266-275 - Added empty string sanitization for course/module/chapter fields before assignment (deployed 2025-10-26 22:38:37)'
    fix_applied_part_c: 'Lines 288-293 - Removed invalid .populate() calls for module and chapter (MissingSchemaError: module/chapter are subdocuments within Course, not separate models). Applied to 5 functions: getAllQuizzes, getQuizById, createQuiz, updateQuiz, duplicateQuiz (deployed 2025-10-26 22:49:21)'
    blocks_test_cases: 'TC 10.2 (Publish Quiz Successfully), TC 1.2 (Edit Quiz), TC 1.5 (Associate Quiz with Chapter)'
    discovered_by: 'QA Agent (Quinn)'
    discovered_date: '2025-10-26 22:10:57'
    status: 'fixed'
    fixed_date: '2025-10-26 22:49:21'
    fixed_by: 'Dev Agent (James)'
    resolution_notes: 'Required 3 iterations to identify and fix all root causes. Initial fixes addressed symptoms (lastEditedBy, empty strings), final fix addressed actual error (invalid Mongoose populate). Excellent collaborative debugging between QA and Dev agents.'

