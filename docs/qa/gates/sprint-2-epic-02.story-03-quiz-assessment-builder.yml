    description: 'Admin creates quiz, adds MCQ question, associates with chapter, publishes'
    status: 'pending_test'

  - scenario: 'Multiple Question Types'
    test_cases: ['TC-2.3', 'TC-3.1', 'TC-4.2', 'TC-5.2']
    description: 'Admin adds MCQ single, MCQ multiple, True/False, Fill-in-Blank to one quiz'
    status: 'pending_test'

  - scenario: 'Question Bank Workflow'
    test_cases: ['TC-6.1', 'TC-6.2', 'TC-6.3']
    description: 'Admin saves question to bank, browses bank, adds questions to new quiz'
