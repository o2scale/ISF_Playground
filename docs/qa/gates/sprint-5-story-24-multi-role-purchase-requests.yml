        expected: "Filtered correctly"
    expected_result: "Admin sees approval queue + assigned requests"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  - id: TC-S24-018
    title: "Purchase Manager sees pending_fulfillment + approved requests"
    priority: P0
    preconditions:
      - "PM assigned to specific Balagruhas"
      - "Requests in various statuses"
    steps:
