regression_tests:
  - id: REG-S24-001
    title: "Story 17-19 workflows still work"
    description: "Multi-role access doesn't break existing PM workflows"
    steps:
      - "PM creates request (Story 17)"
      - "Admin approves (Story 18 - if large purchase)"
      - "PM fulfills (Story 19)"
    expected: "Complete workflow functions correctly"
    status: NOT_TESTED

  - id: REG-S24-002
    title: "Story 20-21 features integrate with multi-role"
    description: "Category and STOCK work with all roles"
    steps:
      - "Coach creates request with category (Story 20)"
      - "Medical creates STOCK request (Story 21)"
      - "Verify all features work together"
    expected: "All features compatible"
    status: NOT_TESTED

edge_cases:
  - scenario: "User with ZERO Balagruha assignments"
    test: "Verify can only create STOCK requests"
    status: NOT_TESTED

  - scenario: "Request with mixed items (some over, some under threshold)"
    test: "Verify MAX item cost used for threshold calculation"
    status: NOT_TESTED

  - scenario: "Exactly Rs 1,001 (Rs 1 over threshold)"
    test: "Verify triggers large purchase workflow"
    status: NOT_TESTED

  - scenario: "Exactly Rs 25,001 (Rs 1 over total threshold)"
    test: "Verify triggers large purchase workflow"
    status: NOT_TESTED

security_tests:
  - id: SEC-S24-001
    title: "Cannot create request for unassigned Balagruha via API tampering"
    priority: P0
    steps:
      - "Intercept API request"
      - "Change balagruhaId to unassigned Balagruha"
      - "Send tampered request"
      - "Verify 403 Forbidden response"
    expected: "Backend security prevents unauthorized Balagruha access"
    status: NOT_TESTED

  - id: SEC-S24-002
    title: "Cannot bypass threshold logic via API tampering"
    priority: P0
    steps:
      - "Create large purchase request"
      - "Intercept API request"
      - "Manually set status to 'pending_fulfillment'"
      - "Send tampered request"
      - "Verify backend recalculates and sets correct status"
    expected: "Backend threshold calculation cannot be bypassed"
    status: NOT_TESTED

