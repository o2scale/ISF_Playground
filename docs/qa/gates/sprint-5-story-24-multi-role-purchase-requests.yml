  # AC8: Threshold Display
  - id: TC-S24-021
    title: "Request details show threshold analysis section"
    priority: P0
    preconditions:
      - "Large purchase request exists"
    steps:
      - action: "Click request row to open details"
        expected: "Details modal opens"
      - action: "Locate 'Approval Threshold Analysis' section"
        expected: "Section visible"
      - action: "Verify displays: Max Item Cost, Total Order Cost, Thresholds"
