        expected: "Small purchases shown"
      - action: "Verify approved requests visible"
        expected: "Admin-approved large purchases shown"
      - action: "Verify pending_approval requests NOT visible"
        expected: "Unapproved requests hidden"
    expected_result: "PM sees requests ready for fulfillment"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  # AC7: Status Badges
  - id: TC-S24-019
    title: "Status filter includes new status values"
    priority: P1
    preconditions:
      - "Status filter dropdown"
    steps:
      - action: "Click Status filter"
        expected: "Dropdown opens"
      - action: "Verify options include: 'Pending Approval', 'Pending Fulfillment', 'Approved', 'Fulfilled', 'Rejected'"
        expected: "All status values present"
    expected_result: "Status filter updated with new values"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  - id: TC-S24-020
    title: "Status badge colors match workflow stages"
    priority: P1
    preconditions:
      - "Requests in different statuses visible"
    steps:
      - action: "Verify 'pending_approval' badge: Red/Orange"
        expected: "Warning color"
      - action: "Verify 'pending_fulfillment' badge: Yellow/Blue"
        expected: "Info color"
      - action: "Verify 'approved' badge: Blue"
