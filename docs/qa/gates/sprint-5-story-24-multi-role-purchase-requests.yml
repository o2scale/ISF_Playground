      - action: "Verify small purchase NOT in list"
        expected: "Request not visible to admin"
      - action: "Login as Purchase Manager"
        expected: "PM logged in"
      - action: "Navigate to pending_fulfillment queue"
        expected: "Fulfillment queue loads"
      - action: "Verify small purchase IS in list"
        expected: "Request ready for fulfillment"
    expected_result: "Small purchase visible to PM, not Admin"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  - id: TC-S24-013
    title: "Small purchase badge shows 'Pending Fulfillment' (yellow)"
    priority: P1
    preconditions:
