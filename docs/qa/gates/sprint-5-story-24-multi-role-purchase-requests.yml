security_tests:
  - id: SEC-S24-001
    title: "Cannot create request for unassigned Balagruha via API tampering"
    priority: P0
    steps:
      - "Intercept API request"
      - "Change balagruhaId to unassigned Balagruha"
      - "Send tampered request"
      - "Verify 403 Forbidden response"
    expected: "Backend security prevents unauthorized Balagruha access"
    status: NOT_TESTED

  - id: SEC-S24-002
    title: "Cannot bypass threshold logic via API tampering"
    priority: P0
    steps:
      - "Create large purchase request"
      - "Intercept API request"
      - "Manually set status to 'pending_fulfillment'"
      - "Send tampered request"
      - "Verify backend recalculates and sets correct status"
    expected: "Backend threshold calculation cannot be bypassed"
    status: NOT_TESTED

