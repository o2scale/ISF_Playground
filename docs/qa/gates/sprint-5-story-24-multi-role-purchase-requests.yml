        expected: "Button visible in dashboard"
      - action: "Click button"
        expected: "Create Purchase Request modal opens"
    expected_result: "Coach has access to create purchase requests"
    actual_result: ""
    status: NOT_TESTED
    notes: "NEW FEATURE: Previously only Purchase Manager could create requests"

  - id: TC-S24-002
    title: "Medical Incharge can create purchase request"
    priority: P0
    preconditions:
      - "Logged in as Medical Incharge (Dr. Sharma)"
    steps:
      - action: "Navigate to Medical Dashboard"
        expected: "Dashboard loads"
      - action: "Click 'Create Purchase Request' button"
        expected: "Modal opens"
      - action: "Fill all required fields"
        expected: "Form filled"
      - action: "Submit request"
        expected: "Request created successfully"
    expected_result: "Medical Incharge can create requests"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  - id: TC-S24-003
    title: "Admin can create purchase request"
    priority: P0
    preconditions:
      - "Logged in as Admin"
    steps:
      - action: "Navigate to Admin Purchase Requests panel"
        expected: "Panel loads"
      - action: "Click 'Create Purchase Request' button"
        expected: "Modal opens"
      - action: "Create request for 'Mathrudhama'"
        expected: "Request created"
    expected_result: "Admin can create requests"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  - id: TC-S24-004
    title: "Purchase Manager retains create access (no regression)"
    priority: P0
    preconditions:
      - "Logged in as Purchase Manager (Ravi)"
    steps:
      - action: "Navigate to Purchase Manager view"
        expected: "View loads"
      - action: "Verify 'New Purchase Request' button still present"
        expected: "Button visible"
      - action: "Create request"
        expected: "Works as before"
