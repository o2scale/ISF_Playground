    actual_result: ""
    status: NOT_TESTED
    notes: "Regression test"

  # AC2: Balagruha Filtering by Assignment
  - id: TC-S24-005
    title: "Balagruha dropdown shows ONLY user's assigned Balagruhas + STOCK"
    priority: P0
    preconditions:
      - "Coach (Priya) assigned ONLY to 'Mathrudhama'"
    steps:
      - action: "Login as Coach, open Create Request modal"
        expected: "Modal opens"
      - action: "Click Balagruha dropdown"
        expected: "Dropdown opens"
      - action: "Verify options: 'STOCK', [divider], 'Mathrudhama'"
        expected: "Only assigned Balagruha shown"
      - action: "Verify 'Sadashraya Charitable Trust' NOT in list"
        expected: "Unassigned Balagruha hidden"
    expected_result: "Dropdown filtered by user assignments"
    actual_result: ""
    status: NOT_TESTED
    notes: "CRITICAL: Security test - prevents cross-Balagruha requests"

  - id: TC-S24-006
    title: "Backend rejects request for unassigned Balagruha"
    priority: P0
    preconditions:
      - "Coach (Priya) assigned to 'Mathrudhama'"
      - "Attempting to create request for 'Sadashraya'"
    steps:
      - action: "POST /api/purchaseRequests with balagruhaId: 'sadashraya-id'"
        expected: "Request rejected"
      - action: "Verify status: 403 Forbidden"
        expected: "403 status"
      - action: "Verify error: 'You can only create requests for Balagruhas you are assigned to'"
        expected: "Error message returned"
    expected_result: "Backend enforces Balagruha assignment security"
    actual_result: ""
    status: NOT_TESTED
    notes: "CRITICAL SECURITY TEST"

  - id: TC-S24-007
    title: "STOCK option always available regardless of assignments"
    priority: P0
    preconditions:
      - "User with limited Balagruha assignments"
    steps:
      - action: "Open Create Request modal"
        expected: "Modal opens"
      - action: "Click Balagruha dropdown"
        expected: "Dropdown opens"
      - action: "Verify 'STOCK' is first option"
        expected: "STOCK present"
      - action: "Select STOCK and create request"
        expected: "Request created successfully"
    expected_result: "STOCK available to all users"
    actual_result: ""
    status: NOT_TESTED
    notes: "Integrates with Story 21"

  # AC3: Threshold Logic
  - id: TC-S24-008
    title: "Small purchase: Status set to 'pending_fulfillment'"
    priority: P0
    preconditions:
      - "Creating request with items totaling ≤ Rs 25,000 and max item ≤ Rs 1,000"
    test_data:
      items:
        - product: "Umbrella"
          quantity: 10
          unit_cost: 500
          total: 5000
        - product: "Notebook"
          quantity: 20
          unit_cost: 50
          total: 1000
      max_item_cost: 500
      total_cost: 6000
    steps:
      - action: "Create request with above items"
        expected: "Request submitted"
      - action: "Check backend calculated status"
        expected: "Status: 'pending_fulfillment'"
      - action: "Verify thresholdAnalysis.requiresApproval: false"
        expected: "requiresApproval = false"
    expected_result: "Small purchase skips admin approval"
    actual_result: ""
    status: NOT_TESTED
    notes: "CORE THRESHOLD LOGIC TEST"

  - id: TC-S24-009
    title: "Large purchase (item cost exceeds): Status 'pending_approval'"
    priority: P0
    preconditions:
      - "Creating request with item cost > Rs 1,000"
    test_data:
      items:
        - product: "Laptop"
          quantity: 5
          unit_cost: 50000
          total: 250000
      max_item_cost: 50000  # Exceeds Rs 1,000
      total_cost: 250000    # Also exceeds Rs 25,000
    steps:
      - action: "Create request with Laptop (Rs 50,000 each)"
        expected: "Request submitted"
      - action: "Check backend calculated status"
        expected: "Status: 'pending_approval'"
      - action: "Verify thresholdAnalysis.requiresApproval: true"
        expected: "requiresApproval = true"
    expected_result: "Large purchase requires admin approval"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  - id: TC-S24-010
    title: "Large purchase (total exceeds): Status 'pending_approval'"
    priority: P0
    preconditions:
      - "Items with low unit cost but high total"
    test_data:
      items:
        - product: "Pen"
          quantity: 1000
          unit_cost: 50
          total: 50000
      max_item_cost: 50    # Within Rs 1,000
      total_cost: 50000    # Exceeds Rs 25,000
    steps:
      - action: "Create request with 1,000 pens (Rs 50 each)"
        expected: "Request submitted"
      - action: "Verify max item cost: Rs 50"
        expected: "Below item threshold"
      - action: "Verify total cost: Rs 50,000"
        expected: "Exceeds total threshold"
      - action: "Check status: 'pending_approval'"
        expected: "Requires approval due to total"
    expected_result: "Total cost threshold triggers approval"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  - id: TC-S24-011
    title: "Boundary test: Exactly Rs 1,000/item and Rs 25,000 total"
    priority: P0
    preconditions:
      - "Creating request at exact threshold limits"
    test_data:
      items:
        - product: "Equipment"
          quantity: 25
          unit_cost: 1000
          total: 25000
      max_item_cost: 1000  # Exactly at threshold
      total_cost: 25000    # Exactly at threshold
    steps:
      - action: "Create request with exact threshold values"
        expected: "Request submitted"
      - action: "Verify status: 'pending_fulfillment'"
        expected: "Status is small purchase"
    expected_result: "Exactly at threshold = small purchase (≤ threshold)"
    actual_result: ""
    status: NOT_TESTED
    notes: "CRITICAL BOUNDARY TEST: <= is small, > is large"

  # AC4: Small Purchase Workflow
  - id: TC-S24-012
    title: "Small purchase bypasses admin approval"
    priority: P0
    preconditions:
      - "Small purchase created (status: pending_fulfillment)"
    steps:
      - action: "Login as Admin"
        expected: "Admin logged in"
      - action: "Navigate to pending_approval queue"
        expected: "Approval queue loads"
      - action: "Verify small purchase NOT in list"
        expected: "Request not visible to admin"
      - action: "Login as Purchase Manager"
        expected: "PM logged in"
      - action: "Navigate to pending_fulfillment queue"
        expected: "Fulfillment queue loads"
      - action: "Verify small purchase IS in list"
        expected: "Request ready for fulfillment"
    expected_result: "Small purchase visible to PM, not Admin"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  - id: TC-S24-013
    title: "Small purchase badge shows 'Pending Fulfillment' (yellow)"
    priority: P1
    preconditions:
      - "Small purchase in list"
    steps:
      - action: "Locate request in table"
        expected: "Request visible"
      - action: "Check status badge"
        expected: "Badge text: 'Pending Fulfillment'"
      - action: "Verify badge color: Yellow/Info blue"
        expected: "Color indicates ready for PM"
      - action: "Hover over badge"
        expected: "Tooltip explains: 'Under approval threshold...'"
    expected_result: "Status badge correctly shows pending_fulfillment"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  # AC5: Large Purchase Workflow
  - id: TC-S24-014
    title: "Large purchase requires admin approval first"
    priority: P0
    preconditions:
      - "Large purchase created (status: pending_approval)"
    steps:
      - action: "Login as Admin"
        expected: "Admin logged in"
      - action: "Navigate to pending_approval queue"
        expected: "Queue loads"
      - action: "Verify large purchase visible"
        expected: "Request in approval queue"
      - action: "Login as Purchase Manager"
        expected: "PM logged in"
      - action: "Navigate to pending_fulfillment queue"
        expected: "Queue loads"
      - action: "Verify large purchase NOT in PM queue yet"
        expected: "Not visible until approved"
    expected_result: "Large purchase visible to Admin, not PM (until approved)"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  - id: TC-S24-015
    title: "Large purchase badge shows 'Pending Approval' (red/orange)"
    priority: P1
    preconditions:
      - "Large purchase in list"
    steps:
      - action: "Locate request in table"
        expected: "Request visible"
      - action: "Check status badge"
        expected: "Badge text: 'Pending Approval'"
      - action: "Verify badge color: Red/Orange/Warning"
        expected: "Color indicates needs admin action"
      - action: "Hover over badge"
        expected: "Tooltip explains threshold exceeded"
    expected_result: "Status badge correctly shows pending_approval"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  # AC6: Role-Based Filtering
  - id: TC-S24-016
    title: "Coach sees only requests for assigned Balagruhas + STOCK"
    priority: P0
    preconditions:
      - "Coach assigned to 'Mathrudhama'"
      - "Requests exist for multiple Balagruhas"
    steps:
      - action: "Login as Coach (Priya)"
        expected: "Coach logged in"
      - action: "Navigate to purchase requests view"
        expected: "Requests list loads"
      - action: "Verify requests for 'Mathrudhama' visible"
        expected: "Mathrudhama requests shown"
      - action: "Verify STOCK requests visible"
        expected: "STOCK requests shown"
      - action: "Verify requests for 'Sadashraya' NOT visible"
        expected: "Unassigned Balagruha requests hidden"
    expected_result: "Coach visibility filtered by assignment"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  - id: TC-S24-017
    title: "Admin sees pending_approval requests + assigned Balagruhas"
    priority: P0
    preconditions:
      - "Admin assigned to specific Balagruhas"
      - "Mix of pending_approval and pending_fulfillment requests"
    steps:
      - action: "Login as Admin"
        expected: "Admin logged in"
