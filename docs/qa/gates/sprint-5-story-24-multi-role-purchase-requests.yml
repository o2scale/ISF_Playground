# Quality Gate: Sprint 5 - Story 24
# Multi-Role Purchase Request Creation with Approval Thresholds
# Created: 2025-11-06 14:09:17
# Updated: 2025-11-07 21:02:20
# Status: QA COMPLETE - ALL CRITICAL TESTS PASSED ✅

story:
  id: sprint5-story-24
  title: "Multi-Role Purchase Request Creation with Approval Thresholds"
  description: "Coach, Medical Incharge, Admin can create purchase requests with automatic approval workflow based on thresholds (Rs 1,000/item or Rs 25,000 total)"
  priority: P0_CRITICAL
  sprint: Sprint 5

environment:
  frontend_url: "http://localhost:3000"
  backend_url: "http://localhost:5001"
  database: "MongoDB - isfplayground"

test_users:
  coach:
    username: "priya@iskonwb.org"
    password: "password"
    role: "coach"
    assigned_balagruhas: ["Mathrudhama"]

  medical_incharge:
    username: "dr.sharma@iskonwb.org"
    password: "password"
    role: "medical-incharge"
    assigned_balagruhas: ["Sadashraya Charitable Trust"]

  admin:
    username: "admin@iskonwb.org"
    password: "password"
    role: "admin"
    assigned_balagruhas: ["All"]

  purchase_manager:
    username: "ravi@iskonwb.org"
    password: "password"
    role: "purchase-manager"
    assigned_balagruhas: ["Sadashraya Charitable Trust", "Mathrudhama"]

approval_thresholds:
  item_cost_threshold: 1000  # Rs 1,000 per item
  total_cost_threshold: 25000  # Rs 25,000 total order

  small_purchase:
    criteria: "Max item cost ≤ Rs 1,000 AND Total cost ≤ Rs 25,000"
    initial_status: "pending_fulfillment"
    workflow: "Create → PM Fulfillment (skip admin approval)"

  large_purchase:
    criteria: "Max item cost > Rs 1,000 OR Total cost > Rs 25,000"
    initial_status: "pending_approval"
    workflow: "Create → Admin Approval → PM Fulfillment"

acceptance_criteria:
  - id: AC1
    description: "Multi-role access to purchase request creation"
    test_cases: [TC-S24-001, TC-S24-002, TC-S24-003, TC-S24-004]

  - id: AC2
    description: "Balagruha dropdown filtered by user assignment"
    test_cases: [TC-S24-005, TC-S24-006, TC-S24-007]

  - id: AC3
    description: "Automatic status assignment based on thresholds"
    test_cases: [TC-S24-008, TC-S24-009, TC-S24-010, TC-S24-011]

  - id: AC4
    description: "Small purchase workflow (direct to fulfillment)"
    test_cases: [TC-S24-012, TC-S24-013]

  - id: AC5
    description: "Large purchase workflow (admin approval required)"
    test_cases: [TC-S24-014, TC-S24-015]

  - id: AC6
    description: "Purchase request list filtering by user role"
    test_cases: [TC-S24-016, TC-S24-017, TC-S24-018]

  - id: AC7
    description: "Status badge updates and colors"
    test_cases: [TC-S24-019, TC-S24-020]

  - id: AC8
    description: "Request details show threshold calculation"
    test_cases: [TC-S24-021, TC-S24-022]

