  issues_found:
    - id: 'BUG-01'
      severity: 'P0_CRITICAL'
      status: 'RESOLVED'
      title: 'Task Details Not Updating When Selecting Different Levels'
      resolved_date: '2025-10-27 20:10:30'
      description: |
        React state management bug prevents task details in Pane 3 from updating when
        users select different levels. API calls work correctly (verified 200 OK responses),
        but UI component does not re-render with new task data.

      expected_behavior: |
        1. Clicking different level cards should load task details for that level
        2. Switching apps should auto-select first unlocked level and load its task details
        3. Task title, instructions, performance metrics, and leaderboard should update

      actual_behavior: |
        1. Task details remain frozen on first task loaded (MS Word Level 1)
        2. Switching apps does NOT auto-select any level (4 console errors)
        3. Manually clicking levels highlights them but task details don't update
        4. API successfully returns correct data but UI state doesn't update

      affected_acs: [8, 10, 16]
      affected_test_cases: ['TC 3.4', 'TC 4.1', 'TC 4.2', 'TC 4.3', 'TC 8.2', 'TC 8.3']

      root_cause: |
        Auto-selection logic in handleAppSelect tries to call handleLevelSelect before
        levels data is loaded, passing null. This causes "Cannot read properties of null
        (reading 'id')" error. Task details fetch fails and state is never updated.

      console_errors:
        - 'TypeError: Cannot read properties of null (reading id) at handleLevelSelect (line 349871:142)'
        - '4 instances logged when switching apps'

      evidence:
        - 'Screenshot: BUG-01-task-details-not-updating.png'
        - 'Network logs show API calls succeed with 200 OK'
        - 'Task title stuck on "CREATE A FORMAL LETTER" (Level 1 task)'

      suggested_fix: |
        1. Make handleAppSelect async and await loadLevels()
        2. Add null check before calling handleLevelSelect
        3. Add useEffect to re-fetch task details when selectedLevel changes
        4. Clear previous selection before loading new app data

      bug_report: 'docs/qa/reports/sprint-2-epic-01-story-02-bug-01.md'

      resolution_summary: |
        Complete fix applied in 2 parts:
        1. Frontend (Re-test #1): Added null checks, fixed race conditions, eliminated console errors
        2. Backend (Re-test #2): Created taskMap with 18 unique tasks, now returns unique data per app/level

        Root cause: Backend was returning identical hardcoded task objects for all apps/levels.
        React's shallow comparison saw same object reference and didn't trigger re-render.

        Fix: Dynamic task generation using appId and levelId parameters, returns unique task objects.
        Result: Task details now update correctly, all tests pass, zero console errors.

      retest_reports:
        - 'docs/qa/reports/sprint-2-epic-01-story-02-bug-01-retest-1.md'  # Partial fix
        - 'docs/qa/reports/sprint-2-epic-01-story-02-bug-01-retest-2.md'  # Complete fix

