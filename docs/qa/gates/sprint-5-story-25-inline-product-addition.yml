edge_cases:
  - scenario: "Rejected request with pending product"
    test: "Create request with pending product → Admin rejects → Verify product remains pending (not deleted)"
    status: NOT_TESTED

  - scenario: "User creates duplicate product name (different SKU)"
    test: "Add 'Pee proof Pants' with auto-SKU → Different user adds 'Pee proof Pants' with different auto-SKU → Both should succeed (different SKUs)"
    status: NOT_TESTED

  - scenario: "Pending product in multiple simultaneous requests"
    test: "User A creates pending product → User B selects it for their request before User A submits → Both requests link to same pending product"
    status: NOT_TESTED

  - scenario: "Large description (200 char limit)"
    test: "Enter 201 characters in description field → Verify truncation or validation"
    status: NOT_TESTED

  - scenario: "Special characters in product name and SKU"
    test: "Enter product name with emojis, SKU with special chars → Verify handled correctly"
    status: NOT_TESTED

  - scenario: "Concurrent product creation with same SKU"
    test: "Two users simultaneously create pending products with same manual SKU → Verify one succeeds, one gets duplicate error"
    status: NOT_TESTED

security_tests:
  - scenario: "Unauthorized user cannot create pending products"
    test: "Logout → POST /api/products/pending → Verify 401 Unauthorized"
    status: NOT_TESTED

  - scenario: "Student role cannot access inline product addition"
    test: "Login as Student → Verify '+ Add New Product' button NOT visible"
    status: NOT_TESTED

  - scenario: "SQL injection in product name"
    test: "Enter malicious SQL in product name → Verify sanitized/escaped"
    status: NOT_TESTED

  - scenario: "XSS in product description"
    test: "Enter <script>alert('XSS')</script> in description → Verify escaped on display"
    status: NOT_TESTED

gate_criteria:
  must_pass:
    - TC-S25-001  # Button visible
