# Pass Criteria (All must be met for PASS)
pass_criteria:
  - 'All critical ACs (1, 2, 6, 7, 8, 13, 15, 20, 21, 27, 28, 29, 32, 38) must pass'
  - 'Test coverage >= 80%'
  - 'No P0 bugs (blocking issues)'
  - 'All E2E test scenarios with P0 priority executed successfully'
  - 'No console errors in browser during normal operation'
  - 'Backend API endpoints return correct HTTP status codes (200/201 for success, 400/401/403/404 for errors)'
  - 'Grading workflow works end-to-end: view submission → select quality → award coins → submit → student notification'
  - 'Coin balance updates correctly in database'
  - 'Real-time notifications sent to students'
  - 'RBAC: Coach can only see submissions from their Balagruha students'

# Fail Criteria (Any one triggers FAIL)
fail_criteria:
  - 'Any critical AC (P0) fails'
  - 'Test coverage < 70%'
  - 'Security vulnerability found (RBAC bypass, unauthorized coin award)'
  - 'Data corruption risk identified'
  - 'Any P0 bug found'
  - 'Cannot submit grade (blocking workflow)'
  - 'Coin balance does not update after grading'
  - 'Student notifications not sent'
  - 'Graded submissions still show as "Pending"'
  - 'Coach can see submissions from other Balagruhas (RBAC violation)'

# Concerns Criteria (Triggers CONCERNS status)
concerns_criteria:
  - 'Test coverage between 70-80%'
  - 'Any P1 bug found (non-blocking but significant)'
  - 'Performance degradation >20% from baseline'
  - 'Missing implementation: Bulk grading, navigation controls, auto-save'
  - 'Video/audio players missing essential controls'

