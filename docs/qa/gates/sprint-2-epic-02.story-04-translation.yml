# Bugs Found During QA Testing
bugs_found:
  total_bugs: 4
  p0_bugs_fixed: 3
  p1_bugs_open: 1

  - bug_id: 'BUG-001'
    title: 'Translation Dashboard - Missing /api/v2 prefix in API calls'
    severity: 'P0'
    status: 'FIXED'
    found_date: '2025-10-27T00:30:00Z'
    fixed_date: '2025-10-27T00:35:00Z'
    affected_file: 'frontend/src/pages/admin/TranslationDashboard.jsx'
    description: 'Frontend made API calls to `/lms/admin/courses` and `/lms/admin/translations/...` instead of `/api/v2/lms/admin/...`, causing 404 errors when selecting courses or fetching progress.'
    root_cause: 'Missing base path prefix in API calls (lines 32, 48)'
    fix: 'Added /api/v2 prefix to both fetchPublishedCourses() and fetchTranslationProgress() API calls'
    test_case: 'TC-1.2, TC-1.3'
    impact: 'BLOCKER - Dashboard completely non-functional'

  - bug_id: 'BUG-002'
    title: 'Translation routes not loaded - backend server restart required'
    severity: 'P0'
    status: 'FIXED'
    found_date: '2025-10-27T00:32:00Z'
    fixed_date: '2025-10-27T00:40:00Z'
    affected_file: 'backend/server.js'
    description: 'Translation route `/api/v2/lms/admin/translations` returned 404 despite being registered in server.js line 156. Routes were not loaded into running server.'
    root_cause: 'Backend server needed restart to load newly created translation routes module'
    fix: 'Restarted backend server (killed PID 31100, restarted via npm start)'
    test_case: 'TC-1.3'
    impact: 'BLOCKER - Translation progress API unavailable'

  - bug_id: 'BUG-003'
    title: 'Translation Editor - Missing /api/v2 prefix in API calls'
    severity: 'P0'
    status: 'FIXED'
    found_date: '2025-10-27T00:42:00Z'
    fixed_date: '2025-10-27T00:44:00Z'
    affected_file: 'frontend/src/pages/admin/TranslationEditor.jsx'
    description: 'Editor made API calls to `/lms/admin/translations/...` instead of `/api/v2/lms/admin/...`, causing 404 errors when loading translatable items, saving translations, or fetching progress.'
    root_cause: 'Missing base path prefix in 3 API calls (lines 56, 68, 80)'
    fix: 'Added /api/v2 prefix to fetchTranslatableItems(), fetchProgress(), and saveTranslation() API calls'
    test_case: 'TC-2.1'
    impact: 'BLOCKER - Translation editor completely non-functional'

  - bug_id: 'BUG-004'
    title: 'Translations not reloaded when navigating back to previous item'
    severity: 'P1'
    status: 'DOCUMENTED'  # Minor UX issue, not blocker
    found_date: '2025-10-27T00:45:00Z'
    fixed_date: null
    affected_file: 'frontend/src/pages/admin/TranslationEditor.jsx'
    description: 'When navigating away from an item and then back (using Previous button), previously entered translations do not reload into textboxes. Textboxes appear empty despite data being saved in backend.'
    root_cause: 'Auto-save updates backend but does not update local items[] array. When navigating, component loads from stale items[] instead of fetching fresh data from server.'
    fix: 'DEFERRED - Requires refactoring: After auto-save, either (1) update items[] array with new Telugu values, OR (2) re-fetch items from server after navigation. No data loss occurs - this is purely a UX issue.'
    test_case: 'TC-4.2'
    impact: 'MINOR - Data is saved correctly. Users can re-enter translations or refresh page to see saved data. Does not block core workflow.'
    verification: 'Confirmed via API that translations ARE saved: curl GET /api/v2/lms/admin/translations/courses/:id/items returns Telugu translations correctly.'

