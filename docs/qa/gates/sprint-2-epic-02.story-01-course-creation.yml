  - 'Any P0 bug found'
  - 'Cannot create course (blocking workflow)'
  - 'Cannot publish course (blocking workflow)'
  - 'Course structure does not persist'
  - 'RBAC bypass possible'

# Concerns Criteria (Triggers CONCERNS status)
