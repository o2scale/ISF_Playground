  issues_found:
    - id: 'BUG-01'
      severity: 'P0_CRITICAL'
      status: 'RESOLVED'
      resolved_date: '2025-10-27 18:27:29'
      title: 'Offline Emotion Queueing Not Working'
      description: |
        Emotion tracking does not queue emotions in localStorage when offline.
        Instead, emotions are sent directly to the backend API even when the
        offline indicator is displayed.

      expected_behavior: |
        When offline event is triggered:
        1. Emotions should be saved to localStorage in 'offlineEmotions' array
        2. Toast should show: "Saved offline - will sync when online 📴"
        3. When online, batch sync should occur via POST /emotions/batch
        4. localStorage should be cleared after successful sync

      actual_behavior: |
        When offline event triggered:
        1. Offline banner displays correctly
        2. Coin balance shows "(Offline)" label correctly
        3. BUT: Emotion clicks still make POST requests to /emotion endpoint
        4. POST requests return 200 OK (network still works)
        5. localStorage 'offlineEmotions' remains null
        6. Toast shows normal "Recorded: 😊" instead of offline message

      impact: |
        Blocks AC 27 (P0 critical acceptance criteria).
        Offline emotion tracking is a key feature for students with unreliable
        internet. Without this, emotion data will be lost when truly offline.

      affected_acs: [27]
      affected_test_cases: ['TC 2.4', 'TC 5.3']

      reproduction:
        steps:
          - 'Navigate to /student/dashboard'
          - 'Trigger offline event: window.dispatchEvent(new Event("offline"))'
          - 'Verify offline banner displays'
          - 'Click emotion buttons (Happy, Sad, Angry)'
          - 'Check localStorage.getItem("offlineEmotions")'
          - 'Check network requests'

        expected: 'localStorage contains emotion array, no POST requests'
        actual: 'localStorage is null, POST requests sent successfully'

      root_cause_hypothesis: |
        The offline detection logic may be checking navigator.onLine instead of
        listening to offline/online events. Or the emotion tracking component is
        not integrated with the offline mode system.

      suggested_fix: |
        1. Ensure emotion tracking component listens to offline/online events
        2. Check navigator.onLine OR offline event state before making API calls
        3. Implement localStorage queue for offline emotions
        4. Add sync mechanism that triggers on online event
        5. Update toast messages to show offline status

      evidence:
        - 'Network requests show POST /emotion with 200 OK while "offline"'
        - 'localStorage offlineEmotions: null'
        - 'Offline banner displayed correctly'
        - 'Screenshot: TC-1.7-offline-indicator.png'

      resolution:
        fix_applied: '2025-10-27 18:21:40'
        file_modified: 'frontend/src/components/student/Toolbar.jsx (line 46)'
        fix_description: |
          Changed offline detection from navigator.onLine to event-based isOffline state.

          Two-stage fix:
          Stage 1 (18:17:15): Check offline BEFORE API call (partial fix)
          Stage 2 (18:21:40): Change line 46 from "if (!navigator.onLine)" to "if (isOffline)"

          This ensures the component uses its event listeners (window 'online'/'offline')
          which correctly detect DevTools offline mode, rather than navigator.onLine which
          stays true for localhost connections.

        re_test_verification:
          date: '2025-10-27 18:27:29'
          verified_behaviors:
            - 'localStorage.offlineEmotions correctly populated with 3 emotions'
            - 'Toast shows "Saved offline - will sync when online 📴"'
            - 'NO POST /emotion requests while offline'
            - 'Batch sync POST /emotions/batch triggered when back online (200 OK)'
            - 'localStorage.offlineEmotions cleared after successful sync'
            - 'Toast shows "Synced 3 emotions" after batch sync'
          result: 'BUG-01 RESOLVED - All expected behaviors working correctly'

