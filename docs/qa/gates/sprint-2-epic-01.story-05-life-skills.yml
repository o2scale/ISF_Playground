# Pass Criteria
pass_criteria:
  - 'All P0 (critical) acceptance criteria pass (AC 1-32, 38, 40, 43-51) - excludes deferred offline ACs 33-37, 39'
  - 'All critical test cases (TC 1.1-7.9) pass'
  - 'Voice recording works: press-and-hold → waveform → 60s limit → playback → submit'
  - 'MCQ quiz works: audio enforcement → delayed feedback → results page with grading'
  - 'Audio question playback works (autoplay, play/pause controls, progress bar)'
  - 'Waveform visualization works (real-time during recording, progress during playback)'
  - 'All 6 API endpoints return 200/201 with correct data structure'
  - 'Coin rewards work: earn coins → Title Bar balance updates'
  - 'No console errors during test execution'
  - 'Desktop layout (1366x768) works correctly'
  - 'Child-friendly UX: encouraging language, large touch targets, color-coded states'

# Fail Criteria
fail_criteria:
  - 'ANY P0 acceptance criteria fails (except deferred offline ACs 33-37, 39)'
  - 'ANY critical test case fails'
  - 'Microphone access broken (cannot record voice)'
  - 'Audio question enforcement broken (Submit enabled before audio finishes)'
  - 'Quiz grading broken (incorrect score calculation or coin rewards)'
  - 'Voice recording broken (cannot record, waveform not working, timer not working)'
  - 'Playback broken (cannot play recorded audio)'
  - 'Submission broken (cannot upload voice file or submit quiz)'
  - 'Delayed feedback broken (correctness shown before finishing quiz)'
  - 'Console errors present (critical errors only)'
  - 'API endpoints return 4xx or 5xx errors'
  - 'Navigation broken (cannot access pages)'
  - 'Waveform visualization broken (no animation or < 30 FPS)'

# Deferred Criteria (Acceptable for PASS)
deferred_criteria:
  - 'Offline mode voice recording queue (AC-33) - Future enhancement'
  - 'Offline mode quiz answer queue (AC-34) - Future enhancement'
  - 'Offline mode coin transaction queue (AC-35) - Future enhancement'
  - 'Offline sync on reconnection (AC-36) - Future enhancement'
  - 'Sync status indicator (AC-37) - Future enhancement'
  - 'Background sync while continuing to next task (AC-39) - Currently blocks during upload'
  - 'Coin flying animation sound effect (AC-45 UX-06) - Optional enhancement'
  - 'Real S3 file upload - Mock S3 URLs acceptable for MVP'
  - 'Audio URLs - Null/undefined acceptable (shows "Audio not available" message)'

