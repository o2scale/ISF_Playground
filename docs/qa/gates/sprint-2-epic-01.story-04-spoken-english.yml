    - 'Auto-redirect after submission not implemented (AC-28)'
    - 'Offline mode not implemented (AC-29, AC-30)'
    - 'Audio instructions URL null in mock data (shows "not available")'
    - 'Video codec VP9 preferred, may fallback to VP8 or H.264 in different browsers'
    - 'Requires HTTPS in production (WebRTC security requirement)'

  technical_details:
    - 'WebRTC: navigator.mediaDevices.getUserMedia() for camera/mic access'
    - 'MediaRecorder: Blob storage with chunks in useRef'
    - 'Recording timer: setInterval with cleanup in useEffect'
    - 'Video source switching: useEffect toggles between srcObject and src'
    - 'State management: Single recordingState variable (initial, recording, recorded, playing, uploading)'
    - 'Cleanup: Webcam stream stopped on unmount, timer cleared'

