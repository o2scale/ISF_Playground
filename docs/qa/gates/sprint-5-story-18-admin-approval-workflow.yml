# Quality Gate: Sprint 5 - Story 18
# Admin Approval Workflow for Multi-Product Purchase Requests
# Created: 2025-10-30 11:38:46
# Status: Ready for Testing

story:
  id: sprint5-story-18
  title: "Admin Approval Workflow for Multi-Product Purchase Requests"
  description: "Admins can view, approve, or reject multi-product purchase requests with detailed product information"
  priority: P0_CRITICAL
  sprint: Sprint 5
  depends_on: sprint5-story-17

environment:
  frontend_url: "http://localhost:3000"
  backend_url: "http://localhost:5001"
  database: "MongoDB - isfplayground"

test_users:
  admin:
    username: "tony.loui.thomas@gmail.com"
    password: "password"
    role: "admin"
    permissions: ["Purchase Management:Manage"]

  purchase_manager:
    username: "ravi@iskonwb.org"
    password: "password"
    role: "purchase-manager"

acceptance_criteria:
  - id: AC1
    description: "Admin can view all purchase requests from all users/balagruhas"
    test_cases: [TC-S18-001, TC-S18-002, TC-S18-003]

  - id: AC2
    description: "Admin can approve purchase requests with optional notes"
    test_cases: [TC-S18-004, TC-S18-005, TC-S18-006]

  - id: AC3
    description: "Admin can reject purchase requests with required reason"
    test_cases: [TC-S18-007, TC-S18-008, TC-S18-009]

  - id: AC4
    description: "Admin can view complete multi-product request details"
    test_cases: [TC-S18-010, TC-S18-011, TC-S18-012]

  - id: AC5
    description: "Self-approval prevention (admin cannot approve own requests)"
    test_cases: [TC-S18-013]

  - id: AC6
    description: "Pending requests dashboard shows correct statistics"
    test_cases: [TC-S18-014, TC-S18-015]

  - id: AC7
    description: "Audit trail tracks approver/rejector and timestamps"
    test_cases: [TC-S18-016, TC-S18-017]

test_cases:
  # AC1: View All Requests
  - id: TC-S18-001
    title: "Admin views all purchase requests"
    priority: P0
    preconditions:
      - "Logged in as Admin (tony.loui.thomas@gmail.com)"
      - "At least 2 purchase requests exist (from different Purchase Managers)"
    steps:
      - action: "Navigate to Purchase → Shop Inventory"
        expected: "Page loads with 'All Purchase Requests' tab visible"
      - action: "Click 'All Purchase Requests' tab"
        expected: "Tab activates, table displays"
      - action: "Check table content"
        expected: "All purchase requests from all users visible"
      - action: "Verify no 403 Forbidden errors"
        expected: "Requests load successfully (200 OK)"
    expected_result: "Admin can see all purchase requests regardless of balagruha"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  - id: TC-S18-002
    title: "Multi-product display in list view"
    priority: P0
    preconditions:
      - "Admin viewing 'All Purchase Requests' tab"
      - "Multi-product requests exist in database"
    steps:
      - action: "Locate a request with 2 products (e.g., PR-001)"
        expected: "Row visible in table"
      - action: "Check 'Products' column"
        expected: "Shows: '2 products: Umbrella (Compact), Notebook'"
      - action: "Check 'Total Items / Quantity' column"
        expected: "Shows: '2 items / 70 units'"
      - action: "Check 'Total Cost' column"
        expected: "Shows: '₹5,000' (formatted with comma)"
    expected_result: "Multi-product information displays correctly in list"
    actual_result: ""
    status: NOT_TESTED
    notes: "Previously showed empty fields - should be fixed"

  - id: TC-S18-003
    title: "Statistics display (Total, Pending, Approved, Rejected)"
    priority: P1
    preconditions:
      - "Mixed purchase requests exist (pending, approved, rejected)"
    steps:
      - action: "View 'All Purchase Requests' tab"
        expected: "Statistics bar visible at top"
      - action: "Check 'Total' count"
        expected: "Shows correct total (e.g., Total: 5)"
      - action: "Check 'Pending' count"
        expected: "Shows pending count (e.g., Pending: 2)"
      - action: "Check 'Approved' count"
        expected: "Shows approved count (e.g., Approved: 2)"
      - action: "Check 'Rejected' count"
        expected: "Shows rejected count (e.g., Rejected: 1)"
    expected_result: "Statistics accurately reflect request statuses"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  # AC2: Approve Requests
  - id: TC-S18-004
    title: "Approve multi-product request (happy path)"
    priority: P0
    preconditions:
      - "At least 1 pending purchase request exists"
      - "Logged in as Admin"
    steps:
      - action: "Locate pending request (e.g., PR-001)"
        expected: "Request visible with status '🟡 Pending Approval'"
      - action: "Click ✅ (Approve) button"
        expected: "Approval modal opens"
      - action: "Verify products table displays correctly"
        expected: |
          Table shows:
          - Product names (e.g., Umbrella, Notebook)
          - SKUs
          - Quantities
          - Stock levels
          - Costs per product
          - Total row with aggregated values
      - action: "Add admin notes: 'Approved for monsoon season preparation'"
        expected: "Notes entered in textarea"
      - action: "Click '✅ Approve Request' button"
        expected: "Button shows 'Approving...'"
      - action: "Wait for response"
        expected: "Success toast: 'Purchase request approved successfully'"
      - action: "Check request status in list"
        expected: "Status changed to '✅ Approved'"
      - action: "Check statistics"
        expected: "Pending count decreased by 1, Approved count increased by 1"
    expected_result: "Request approved successfully with multi-product display working"
    actual_result: ""
    status: NOT_TESTED
    notes: "Previously showed empty product fields and NaN - should be fixed"

  - id: TC-S18-005
    title: "Approve request without admin notes (optional)"
    priority: P1
    preconditions:
      - "Pending request exists"
    steps:
      - action: "Click ✅ on pending request"
        expected: "Modal opens"
      - action: "Leave 'Admin Notes' field empty"
        expected: "Field empty"
      - action: "Click '✅ Approve Request' button"
        expected: "Approval proceeds"
      - action: "Wait for response"
        expected: "Success toast shown, request approved"
    expected_result: "Admin notes are optional, approval works without them"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  - id: TC-S18-006
    title: "Cancel approval (close modal)"
    priority: P2
    preconditions:
      - "Approval modal open"
    steps:
      - action: "Click 'Cancel' button"
        expected: "Modal closes"
      - action: "Check request status"
        expected: "Remains 'Pending Approval' (unchanged)"
    expected_result: "Canceling approval does not change request status"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  # AC3: Reject Requests
  - id: TC-S18-007
    title: "Reject multi-product request with reason (happy path)"
    priority: P0
    preconditions:
      - "At least 1 pending purchase request exists"
      - "Logged in as Admin"
    steps:
      - action: "Locate pending request (e.g., PR-002)"
        expected: "Request visible"
      - action: "Click ❌ (Reject) button"
        expected: "Rejection modal opens"
      - action: "Verify products table displays correctly"
        expected: |
          Table shows:
          - Product names
          - SKUs
          - Quantities
          - Costs
          - Total row
      - action: "Check 'Rejection Reason' field"
        expected: "Field is required (marked with *)"
      - action: "Verify 'Reject Request' button state"
        expected: "Button disabled (grayed out)"
      - action: "Enter reason: 'Budget constraints for this quarter. Please resubmit next month.'"
        expected: "Text entered, button becomes enabled"
      - action: "Click '❌ Reject Request' button"
        expected: "Button shows 'Rejecting...'"
      - action: "Wait for response"
        expected: "Success toast: 'Purchase request rejected'"
      - action: "Check request status in list"
        expected: "Status changed to '❌ Rejected'"
      - action: "Check statistics"
        expected: "Pending decreased by 1, Rejected increased by 1"
    expected_result: "Request rejected successfully with multi-product display working"
    actual_result: ""
    status: NOT_TESTED
    notes: "Previously showed empty product fields - should be fixed"

  - id: TC-S18-008
    title: "Validation: Reject without reason (required)"
    priority: P1
    preconditions:
      - "Rejection modal open"
    steps:
      - action: "Leave 'Rejection Reason' field empty"
        expected: "Field empty"
      - action: "Check '❌ Reject Request' button"
        expected: "Button is disabled"
      - action: "Try clicking disabled button"
        expected: "Nothing happens (click prevented)"
    expected_result: "Rejection reason is enforced, button disabled until filled"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  - id: TC-S18-009
    title: "Cancel rejection (close modal)"
    priority: P2
    preconditions:
      - "Rejection modal open"
    steps:
      - action: "Enter rejection reason"
        expected: "Reason entered"
      - action: "Click 'Cancel' button"
        expected: "Modal closes"
      - action: "Check request status"
        expected: "Remains 'Pending Approval' (unchanged)"
    expected_result: "Canceling rejection does not change request status"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  # AC4: View Request Details
  - id: TC-S18-010
    title: "View multi-product request details via 👁️ button"
    priority: P1
    preconditions:
      - "Multi-product request exists"
    steps:
      - action: "Click 👁️ (View) button on any request"
        expected: "View Details modal opens"
      - action: "Check modal displays all request information"
        expected: |
          Modal shows:
          - Request ID
          - Products table with all items
          - Balagruha name
          - Requested by (user name)
          - Reason and justification
          - Status and timestamps
    expected_result: "Complete request details displayed correctly"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  - id: TC-S18-011
    title: "Products table in approval modal shows all columns"
    priority: P0
    preconditions:
      - "Approval modal open with multi-product request"
    steps:
      - action: "Check table header row"
        expected: "Columns: Product | SKU | Qty | Stock | Cost"
      - action: "Check first product row"
        expected: "All fields populated (no empty cells)"
      - action: "Check stock column format"
        expected: "Shows: 'X/Y' (e.g., '5/10')"
      - action: "Check cost column format"
        expected: "Shows: '₹X,XXX' (formatted with rupee and commas)"
      - action: "Check total row"
        expected: "Shows aggregated quantity and total cost"
    expected_result: "All table columns display data correctly"
    actual_result: ""
    status: NOT_TESTED
    notes: "Critical test - was showing empty fields before"

  - id: TC-S18-012
    title: "Products table in rejection modal shows all columns"
    priority: P0
    preconditions:
      - "Rejection modal open with multi-product request"
    steps:
      - action: "Check table header row"
        expected: "Columns: Product | SKU | Qty | Cost"
      - action: "Check product rows"
        expected: "All fields populated"
      - action: "Check total row"
        expected: "Shows aggregated quantity and total cost"
    expected_result: "All table columns display data correctly"
    actual_result: ""
    status: NOT_TESTED
    notes: "Critical test - was showing empty fields before"

  # AC5: Self-Approval Prevention
  - id: TC-S18-013
    title: "Admin cannot approve own requests"
    priority: P1
    preconditions:
      - "Admin user has created a purchase request as Purchase Manager role (unlikely scenario)"
    steps:
      - action: "Login as user with both Admin and Purchase Manager roles"
        expected: "User logged in"
      - action: "Create purchase request"
        expected: "Request created"
      - action: "Switch to admin view"
        expected: "View all requests"
      - action: "Try to approve own request"
        expected: "Approve button disabled or error message shown"
    expected_result: "Self-approval is prevented"
    actual_result: ""
    status: NOT_TESTED
    notes: "Edge case - may not be testable with current test data"

  # AC6: Dashboard Statistics
  - id: TC-S18-014
    title: "Statistics update after approval"
    priority: P1
    preconditions:
      - "At least 1 pending request exists"
    steps:
      - action: "Note current statistics (e.g., Pending: 3, Approved: 2)"
        expected: "Statistics displayed"
      - action: "Approve 1 pending request"
        expected: "Approval successful"
      - action: "Check updated statistics"
        expected: "Pending: 2, Approved: 3"
    expected_result: "Statistics refresh correctly after approval"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  - id: TC-S18-015
    title: "Statistics update after rejection"
    priority: P1
    preconditions:
      - "At least 1 pending request exists"
    steps:
      - action: "Note current statistics (e.g., Pending: 3, Rejected: 1)"
        expected: "Statistics displayed"
      - action: "Reject 1 pending request with reason"
        expected: "Rejection successful"
      - action: "Check updated statistics"
        expected: "Pending: 2, Rejected: 2"
    expected_result: "Statistics refresh correctly after rejection"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  # AC7: Audit Trail
  - id: TC-S18-016
    title: "Approved request shows reviewer and timestamp"
    priority: P2
    preconditions:
      - "Request has been approved"
    steps:
      - action: "View approved request details"
        expected: "Details modal opens"
      - action: "Check for 'Reviewed By' field"
        expected: "Shows admin name (e.g., 'Tony Thomas')"
      - action: "Check for 'Reviewed At' timestamp"
        expected: "Shows approval date and time"
      - action: "Check for 'Admin Notes' field"
        expected: "Shows notes entered during approval"
    expected_result: "Audit trail captured correctly"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

  - id: TC-S18-017
    title: "Rejected request shows reviewer and reason"
    priority: P2
    preconditions:
      - "Request has been rejected"
    steps:
      - action: "View rejected request details"
        expected: "Details modal opens"
      - action: "Check for 'Reviewed By' field"
        expected: "Shows admin name"
      - action: "Check for 'Reviewed At' timestamp"
        expected: "Shows rejection date and time"
      - action: "Check for 'Rejection Reason' field"
        expected: "Shows reason entered during rejection"
    expected_result: "Rejection audit trail captured correctly"
    actual_result: ""
    status: NOT_TESTED
    notes: ""

edge_cases:
  - id: EDGE-S18-001
    title: "Approve request with very long admin notes (500 chars)"
    steps:
      - "Open approval modal"
      - "Enter 500 characters in admin notes"
      - "Approve request"
    expected: "Notes accepted, request approved"
    status: NOT_TESTED

  - id: EDGE-S18-002
    title: "Filter requests by status (Pending only)"
    steps:
      - "Select 'Pending Approval' from status filter"
      - "Table shows only pending requests"
    expected: "Filter works correctly"
    status: NOT_TESTED

  - id: EDGE-S18-003
    title: "Filter requests by balagruha"
    steps:
      - "Select specific balagruha from filter"
      - "Table shows only requests from that balagruha"
    expected: "Balagruha filter works"
    status: NOT_TESTED

  - id: EDGE-S18-004
    title: "Single product request display"
    steps:
      - "View request with only 1 product"
      - "Products column shows: '1 product: Product Name'"
      - "Approval modal shows single row in table"
    expected: "Single product displays correctly"
    status: NOT_TESTED

  - id: EDGE-S18-005
    title: "Three or more products display"
    steps:
      - "View request with 4 products"
      - "Products column shows: '4 products: Product1, Product2 +2 more'"
    expected: "Truncation works for 3+ products"
    status: NOT_TESTED

bugs_discovered: []

integration_tests:
  - id: INT-S18-001
    title: "End-to-end workflow: Create → Approve → Verify"
    steps:
      - "Login as Purchase Manager (ravi)"
      - "Create multi-product request"
      - "Logout"
      - "Login as Admin (tony.loui.thomas@gmail.com)"
      - "Approve the request"
      - "Verify request status and audit trail"
    expected: "Complete workflow works seamlessly"
    status: NOT_TESTED

  - id: INT-S18-002
    title: "End-to-end workflow: Create → Reject → Verify"
    steps:
      - "Login as Purchase Manager"
      - "Create multi-product request"
      - "Logout"
      - "Login as Admin"
      - "Reject with reason"
      - "Verify Purchase Manager sees rejection reason"
    expected: "Rejection workflow complete"
    status: NOT_TESTED

