    location: "frontend/src/components/purchaseManagement/modals/ViewRequestModal.jsx"
    fix_applied: "Updated ViewRequestModal.jsx to iterate over request.items[] array and display complete products table with 7 columns (Product, SKU, Requested Qty, Current Stock, Threshold, Unit Cost, Total Cost) plus footer row with totals"
