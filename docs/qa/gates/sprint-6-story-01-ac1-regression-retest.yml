# Critical Bug Details
critical_bugs:
  - id: S6-S1-RETEST-BUG-001
    severity: CRITICAL
    priority: P0
    title: Year Boundary Navigation Failure (Dec 2025 → Jan 2025 instead of Jan 2026)
    description: |
      When navigating forward from the last week of December 2025 using the Next arrow,
      the calendar incorrectly transitions to January 2025 instead of January 2026.
      The year dropdown remains at "2025" and does not increment to "2026".

    steps_to_reproduce:
      - Navigate to December 2025
      - Click Next arrow 4 times to reach Week 5 (last week of December)
      - Click Next arrow one more time to cross year boundary
      - Observe calendar shows January 2025 instead of January 2026

    expected_behavior: Calendar should show January 2026, Week 1 with year dropdown at "2026"
    actual_behavior: Calendar shows January 2025, Week 1 with year dropdown at "2025"

    impact: |
      BLOCKING: Users cannot navigate forward across year boundaries using week arrows.
      This breaks the fundamental week navigation functionality when crossing years.

      Workaround: Users can manually select year from dropdown, but this defeats the
      purpose of the convenient arrow navigation feature.

    root_cause_hypothesis: |
      Week navigation logic likely calculates next/previous week correctly but fails
      to update the year state variable when crossing year boundaries. The month
      auto-update works (wraps from 11→0) but year increment logic is missing.

    code_location_hint: |
      Likely in CoachDashboard component or related calendar utility functions
      handling week navigation state management (handleWeekChange or similar).

    test_case: TC-AC1-WEEK-008
    found_in: AC1 Regression Re-Test
    found_by: Quinn (Test Architect)
    found_date: 2025-11-11

