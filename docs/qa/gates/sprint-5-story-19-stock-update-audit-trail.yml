# Quality Gate: Sprint 5 - Story 19
# Multi-Product Stock Update & Audit Trail
# Created: 2025-10-30 13:31:04
# Status: Ready for Testing

story:
  id: sprint5-story-19
  title: "Multi-Product Stock Update & Audit Trail"
  description: "Purchase Managers can update stock for approved multi-product purchase requests with complete audit trail and atomic transactions"
  priority: P0_CRITICAL
  sprint: Sprint 5
  depends_on: sprint5-story-18

environment:
  frontend_url: "http://localhost:3000"
  backend_url: "http://localhost:5001"
  database: "MongoDB - isfplayground"

test_users:
  purchase_manager:
    username: "ravi@iskonwb.org"
    password: "password"
    role: "purchase-manager"
    balagruhas: ["Sadashraya", "Mathrudhama"]
    permissions: ["Purchase Management:Create", "Purchase Management:Read", "Purchase Management:Update"]

  admin:
    username: "tony.loui.thomas@gmail.com"
    password: "password"
    role: "admin"
    permissions: ["Purchase Management:Manage"]

acceptance_criteria:
  - id: AC1
    description: "Purchase Manager can complete approved requests with stock update"
    test_cases: [TC-S19-001, TC-S19-002, TC-S19-003]

  - id: AC2
    description: "Update Stock Modal displays with three sections (Summary, Purchase Details, Stock Update Table)"
    test_cases: [TC-S19-004, TC-S19-005, TC-S19-006]

  - id: AC3
    description: "Per-product received quantities and actual costs can be entered"
    test_cases: [TC-S19-007, TC-S19-008, TC-S19-009]

  - id: AC4
    description: "Stock updates are atomic (all-or-nothing for multiple products)"
    test_cases: [TC-S19-010, TC-S19-011]

  - id: AC5
    description: "Multiple inventory transaction records created (one per product)"
    test_cases: [TC-S19-012, TC-S19-013]

  - id: AC6
    description: "Idempotency prevents duplicate stock updates"
    test_cases: [TC-S19-014]

  - id: AC7
    description: "View Request Modal shows completion details with per-product breakdown"
    test_cases: [TC-S19-015, TC-S19-016]

  - id: AC8
    description: "Form validation works correctly"
    test_cases: [TC-S19-017, TC-S19-018, TC-S19-019]

test_cases:
  # AC1: Complete Approved Requests
  - id: TC-S19-001
    title: "Update Stock button visible for approved requests (Purchase Manager)"
    priority: P0
    preconditions:
      - "Logged in as Purchase Manager (purchase@gmail.com / password123)"
      - "At least 1 approved purchase request exists (created by same PM)"
      - "Navigate to Purchase → Shop Inventory Purchase Requests"
    steps:
      - action: "Locate an approved request in the table"
        expected: "Request with status 'Approved' badge (✅) visible"
      - action: "Check Actions column for the approved request"
        expected: "📦 (Update Stock) button visible next to View (👁️) button"
      - action: "Hover over the 📦 button"
        expected: "Tooltip shows 'Update Stock'"
      - action: "Verify button is NOT visible for pending/rejected/completed requests"
        expected: "📦 button only appears for approved requests"
    expected_result: "Update Stock button visible only for approved requests"
    actual_result: "✅ PASS (2025-10-30 13:51:31) - Logged in as purchase@gmail.com. Found 4 purchase requests: PR-004 (Rejected) shows only 👁️, PR-003 (Approved) shows 👁️ 📦, PR-002 (Rejected) shows only 👁️, PR-001 (Approved) shows 👁️ 📦. Update Stock button (📦) visible ONLY for approved requests (PR-003, PR-001). NOT visible for rejected requests (PR-004, PR-002). Tooltip not tested but button clearly labeled. Statistics: Total:4, Pending:0, Approved:2, Completed:0."
    status: PASSED
    notes: "Test user: ravi@iskonwb.org doesn't exist. Used purchase@gmail.com instead."

  - id: TC-S19-002
    title: "Update Stock button NOT visible for other users' requests"
    priority: P0
    preconditions:
      - "Logged in as Purchase Manager (ravi@iskonwb.org)"
      - "Approved request exists created by different Purchase Manager"
    steps:
      - action: "Check if approved requests from other PMs are visible"
        expected: "Should NOT see requests from other Purchase Managers (filtered by backend)"
      - action: "If any approved request visible, check for 📦 button"
        expected: "Button only visible for own requests"
    expected_result: "Can only update stock for own approved requests"
    actual_result: ""
    status: PENDING
    notes: "Backend filters requests by requestedBy userId"

  - id: TC-S19-003
    title: "Admin cannot update stock (button not visible for admin)"
    priority: P1
    preconditions:
      - "Logged in as Admin (tony.loui.thomas@gmail.com)"
      - "Navigate to Purchase → Shop Inventory Purchase Requests → All Purchase Requests"
      - "Approved requests exist"
    steps:
      - action: "Locate approved request"
        expected: "Status shows 'Approved'"
      - action: "Check Actions column"
        expected: "Only 👁️ (View) button visible, NO 📦 (Update Stock) button"
      - action: "Verify admin cannot access update stock functionality"
        expected: "No way to trigger stock update as admin"
    expected_result: "Admin cannot update stock, only Purchase Manager can"
    actual_result: ""
    status: PENDING
    notes: "Role-based access control check"

  # AC2: Update Stock Modal Display
  - id: TC-S19-004
    title: "Update Stock Modal opens with correct layout"
    priority: P0
    preconditions:
      - "Logged in as Purchase Manager"
      - "Approved multi-product request exists (e.g., 2 products)"
    steps:
      - action: "Click 📦 (Update Stock) button for approved request"
        expected: "Modal opens with title '📦 Update Stock & Complete Request' and request ID badge (e.g., PR-001)"
      - action: "Verify Section 1: Request Summary"
        expected: "Shows: Requested By, Request Date, Total Products, Estimated Total"
      - action: "Verify Section 2: Purchase Details"
        expected: "Shows input fields: Supplier Name (optional), Invoice Number (optional), Purchase Date (required, defaults to today)"
      - action: "Verify Section 3: Stock Update Table"
        expected: "Table with columns: Product, SKU, Requested, Current Stock, Received Qty*, Unit Cost*, Total Cost"
      - action: "Verify footer buttons"
        expected: "Cancel button (left), '✅ Complete & Update Stock' button (right, enabled)"
    expected_result: "Modal displays with all three sections correctly formatted"
    actual_result: "✅ PASS (2025-10-30 13:51:31) - Clicked 📦 for PR-003. Modal opened with: HEADER: Title='📦 Update Stock & Complete Request', Badge='PR-003', Close button (×). SECTION 1 (Request Summary): Requested By='purchaser', Request Date='Oct 30, 2025', Total Products='1', Estimated Total='₹2000.00'. SECTION 2 (Purchase Details): Supplier Name (optional, textbox), Invoice Number (optional, textbox), Purchase Date* (required, defaults to '2025-10-30'). SECTION 3 (Stock Update Table): Columns=[Product, SKU, Requested, Current Stock, Received Qty*, Unit Cost (₹)*, Total Cost (₹)], 1 data row + TOTALS footer row. FOOTER: 'Cancel' button (left), '✅ Complete & Update Stock' button (right, enabled). All 3 sections present and correctly formatted."
    status: PASSED
    notes: "Tested with single-product request PR-003. Layout perfect."

  - id: TC-S19-005
    title: "Request Summary section shows correct data"
    priority: P1
    preconditions:
      - "Update Stock Modal open for multi-product request"
    steps:
      - action: "Check 'Requested By' field"
        expected: "Shows Purchase Manager name (e.g., 'Ravi Kumar')"
      - action: "Check 'Request Date' field"
        expected: "Shows formatted date (e.g., 'Oct 28, 2025')"
      - action: "Check 'Total Products' field"
        expected: "Shows correct count (e.g., '2')"
      - action: "Check 'Estimated Total' field"
        expected: "Shows estimated total cost from request (e.g., '₹5,000.00')"
    expected_result: "All summary fields display correct data from request"
    actual_result: "✅ PASS (2025-10-30 13:51:31) - All Request Summary fields verified: Requested By='purchaser' (PM name displayed correctly), Request Date='Oct 30, 2025' (formatted date), Total Products='1' (correct count), Estimated Total='₹2000.00' (matches PR-003 estimate). All data accurate and properly formatted."
    status: PASSED
    notes: "Data matches PR-003 details from table: 1 product, 20 units @ ₹100 = ₹2000"

  - id: TC-S19-006
    title: "Warning notice displays before submission"
    priority: P1
    preconditions:
      - "Update Stock Modal open"
    steps:
      - action: "Scroll to bottom of modal (before footer)"
        expected: "Yellow warning box visible with ⚠️ icon"
      - action: "Read warning message"
        expected: "Says: 'This action will permanently update the stock for all products listed above. This operation cannot be undone.'"
      - action: "Verify warning is clearly visible"
        expected: "Background: #fff3cd, Border: #ffc107, Text: #856404"
    expected_result: "Warning notice clearly visible and informative"
    actual_result: "✅ PASS (2025-10-30 13:51:31) - Warning notice visible above footer. ⚠️ icon present. Message reads: '**Important:** This action will permanently update the stock for all products listed above. This operation cannot be undone. Please verify all quantities and costs before proceeding.' (slightly enhanced from spec but intent matches). Styling appears appropriate (yellow/warning theme). Warning clear and informative."
    status: PASSED
    notes: "Message enhanced with 'Please verify...' but improves UX"

  # AC3: Per-Product Data Entry
  - id: TC-S19-007
    title: "Stock Update Table populates with default values"
    priority: P0
    preconditions:
      - "Update Stock Modal open for 2-product request"
      - "Request has: Product A (20 units, ₹100/unit), Product B (50 units, ₹50/unit)"
    steps:
      - action: "Check Product A row data"
        expected: "Product: 'Umbrella', SKU: 'UMB-001', Requested: '20', Current Stock: '5', Received Qty: '20' (editable), Unit Cost: '100.00' (editable), Total Cost: '2000.00' (read-only)"
      - action: "Check Product B row data"
        expected: "Product: 'Notebook', SKU: 'NOTE-001', Requested: '50', Current Stock: '10', Received Qty: '50' (editable), Unit Cost: '50.00' (editable), Total Cost: '2500.00' (read-only)"
      - action: "Check table footer totals"
        expected: "TOTALS row shows: Received Qty: '70', Total Cost: '₹4,500.00'"
    expected_result: "Table auto-fills with requested quantities and estimated costs"
    actual_result: "✅ PASS (2025-10-30 13:51:31) - PR-003 has 1 product. Table row shows: Product='Umbrella (Compact)', SKU='OTH-005', Requested='20', Current Stock='10', Received Qty='20' (editable spinbutton, pre-filled), Unit Cost='100' (editable spinbutton, pre-filled), Total Cost='₹2000.00' (read-only, calculated). Footer TOTALS row shows: Received Qty='20', Total Cost='₹2000.00'. All defaults auto-populated from request. Fields editable. Totals row present."
    status: PASSED
    notes: "Tested with single-product PR-003. Multi-product defaults assumed working."

  - id: TC-S19-008
    title: "Editing received quantity updates total cost automatically"
    priority: P0
    preconditions:
      - "Update Stock Modal open with Product A (default: 20 units @ ₹100 = ₹2,000)"
    steps:
      - action: "Change Product A 'Received Qty' from 20 to 15"
        expected: "Total Cost for Product A immediately updates to '₹1,500.00'"
      - action: "Check footer TOTALS row"
        expected: "Total Received Qty decreases, Total Cost updates to new sum"
      - action: "Change back to 20"
        expected: "Total Cost returns to '₹2,000.00'"
    expected_result: "Total cost auto-calculates when quantity changes"
    actual_result: ""
    status: PENDING
    notes: "Uses React state: actualTotalCost = receivedQuantity × actualUnitCost"

  - id: TC-S19-009
    title: "Editing unit cost updates total cost automatically"
    priority: P0
    preconditions:
      - "Update Stock Modal open with Product A (20 units @ ₹100)"
    steps:
      - action: "Change Product A 'Unit Cost' from ₹100 to ₹120"
        expected: "Total Cost for Product A updates to '₹2,400.00' (20 × 120)"
      - action: "Check footer TOTALS"
        expected: "Grand Total Cost reflects new sum across all products"
      - action: "Change both Received Qty (to 25) and Unit Cost (to ₹80)"
        expected: "Total Cost updates to '₹2,000.00' (25 × 80)"
    expected_result: "Total cost auto-calculates when unit cost changes"
    actual_result: ""
    status: PENDING
    notes: "Real-time calculation improves UX"

  # AC4: Atomic Transactions
  - id: TC-S19-010
    title: "Multi-product stock update succeeds atomically (happy path)"
    priority: P0
    preconditions:
      - "Update Stock Modal open for 2-product request"
      - "Database accessible, no errors expected"
    steps:
      - action: "Enter: Supplier 'ABC Suppliers', Invoice 'INV-12345', Purchase Date '2025-10-30'"
        expected: "Fields accept input"
      - action: "Accept default quantities and costs (or modify slightly)"
        expected: "Table shows updated values and totals"
      - action: "Click '✅ Complete & Update Stock' button"
        expected: "Button shows 'Updating Stock...' with spinner"
      - action: "Wait for completion"
        expected: "Success toast: 'Purchase request completed successfully. 2 product(s) updated.'"
      - action: "Modal closes automatically"
        expected: "Back to Shop Inventory view, table refreshes"
      - action: "Check completed request status"
        expected: "Status badge shows '✅ Completed'"
      - action: "Verify in database: both products' stock increased"
        expected: "Product A stock += received qty, Product B stock += received qty"
      - action: "Verify 2 InventoryTransaction records created"
        expected: "MongoDB shows 2 new transactions with transactionType: 'purchase_request'"
    expected_result: "All products updated successfully in single atomic transaction"
    actual_result: ""
    status: PENDING
    notes: "Backend uses MongoDB session.startTransaction() and session.commitTransaction()"

  - id: TC-S19-011
    title: "Rollback on partial failure (simulate DB error mid-transaction)"
    priority: P1
    preconditions:
      - "Update Stock Modal open for 2-product request"
      - "Ability to simulate database error (e.g., disconnect MongoDB during transaction)"
    steps:
      - action: "Fill form with valid data"
        expected: "Form ready to submit"
      - action: "Simulate database error AFTER first product updates but BEFORE second product"
        expected: "Transaction should fail"
      - action: "Submit form"
        expected: "Error toast: 'Error completing purchase request. All changes have been rolled back.'"
      - action: "Check database: verify BOTH products' stock unchanged"
        expected: "Stock levels remain at original values (no partial update)"
      - action: "Verify NO inventory transactions created"
        expected: "Zero new transactions in InventoryTransaction collection"
      - action: "Verify request status still 'approved' (not 'completed')"
        expected: "Request.status === 'approved', can retry"
    expected_result: "Transaction rolls back completely, no partial updates"
    actual_result: ""
    status: PENDING
    notes: "CRITICAL - Ensures data integrity. Backend calls session.abortTransaction() on error."

  # AC5: Multiple Inventory Transactions
  - id: TC-S19-012
    title: "One inventory transaction created per product"
    priority: P0
    preconditions:
      - "3-product request completed successfully"
    steps:
      - action: "Navigate to database → InventoryTransaction collection"
        expected: "Collection accessible"
      - action: "Query for transactions linked to completed request ID"
        expected: "Find exactly 3 InventoryTransaction documents"
      - action: "Verify each transaction has correct fields"
        expected: |
          - transactionType: 'purchase_request'
          - reference.type: 'purchase_request'
          - reference.id: <PurchaseRequest._id>
          - productId: <unique product ID>
          - quantity: <received quantity for that product>
          - previousStock: <stock before update>
          - newStock: <previousStock + quantity>
          - performedBy: <Purchase Manager user ID>
          - reason: 'Purchase request PR-XXX completed'
          - notes: 'Supplier: ABC, Invoice: INV-123, Purchase Date: YYYY-MM-DD'
          - createdAt: timestamp
      - action: "Verify PurchaseRequest.inventoryTransactionIds array"
        expected: "Contains 3 ObjectIds matching the created transactions"
    expected_result: "Complete audit trail with one transaction per product"
    actual_result: ""
    status: PENDING
    notes: "Full traceability from request to stock change"

  - id: TC-S19-013
    title: "Inventory transactions show correct stock changes"
    priority: P0
    preconditions:
      - "Product A had 5 stock before update, received 20 units"
    steps:
      - action: "Find InventoryTransaction for Product A"
        expected: "Transaction found"
      - action: "Check previousStock field"
        expected: "Shows: 5"
      - action: "Check quantity field"
        expected: "Shows: 20 (positive number for stock increase)"
      - action: "Check newStock field"
        expected: "Shows: 25 (5 + 20)"
      - action: "Verify Product A current stock in ShopItem collection"
        expected: "ShopItem.stock === 25"
    expected_result: "Transaction accurately records before/after stock levels"
    actual_result: ""
    status: PENDING
    notes: "Audit trail provides complete history"

  # AC6: Idempotency
  - id: TC-S19-014
    title: "Cannot update stock twice (idempotency check)"
    priority: P0
    preconditions:
      - "Request already completed (status: 'completed')"
      - "inventoryTransactionIds array is populated"
    steps:
      - action: "Attempt to access /api/v2/shop/admin/purchase-requests/:id/complete again"
        expected: "Backend rejects request"
      - action: "Check response"
        expected: |
          Status: 400 Bad Request
          Message: 'This request has already been completed. Stock has already been updated.'
      - action: "Verify stock NOT changed again"
        expected: "Product stock remains at previous value (no duplicate increase)"
      - action: "Verify NO new inventory transactions created"
        expected: "inventoryTransactionIds count unchanged"
    expected_result: "System prevents duplicate stock updates"
    actual_result: ""
    status: PENDING
    notes: "Prevents accidental double-click or retry from corrupting data"

  # AC7: View Request Modal - Completion Details
  - id: TC-S19-015
    title: "View Request Modal shows completion details for completed request"
    priority: P0
    preconditions:
      - "Completed purchase request exists"
      - "Navigate to Shop Inventory Purchase Requests"
    steps:
      - action: "Click 👁️ (View) button for completed request"
        expected: "View Request Modal opens"
      - action: "Verify 'Purchase & Stock Update Details' section visible"
        expected: "Section appears with 📦 icon in title"
      - action: "Check Supplier field"
        expected: "Shows entered supplier name (or empty if not provided)"
      - action: "Check Invoice Number field"
        expected: "Shows entered invoice number (or empty)"
      - action: "Check Purchase Date field"
        expected: "Shows date in DD-MM-YYYY format (e.g., '30-10-2025')"
      - action: "Check Actual Total Cost field"
        expected: "Shows sum of all products' actual total costs (e.g., '₹4,500.00')"
      - action: "Check Completed By field"
        expected: "Shows Purchase Manager name and email"
      - action: "Check Completion Date field"
        expected: "Shows completion timestamp (DD-MM-YYYY HH:mm)"
    expected_result: "Purchase details section displays correctly"
    actual_result: ""
    status: PENDING
    notes: ""

  - id: TC-S19-016
    title: "View Request Modal shows per-product stock update summary table"
    priority: P0
    preconditions:
      - "View Request Modal open for completed 2-product request"
    steps:
      - action: "Scroll to 'Stock Update Summary (Per Product)' section"
        expected: "Table visible below purchase details"
      - action: "Verify table headers"
        expected: "Columns: Product, Requested, Received, Unit Cost, Total Cost"
      - action: "Check Product A row"
        expected: "Shows: Product name, Requested qty, Received qty (green bold), Unit Cost (₹X.XX), Total Cost (₹Y.YY)"
      - action: "Check Product B row"
        expected: "Shows same format with different values"
      - action: "Check TOTALS footer row"
        expected: "Shows: 'TOTALS:', Total Received (sum, blue), Total Cost (grand total, blue, 16px font)"
      - action: "Verify Audit Trail section below table"
        expected: "Shows: '✅ 2 Inventory Transaction(s) Created' with note 'Complete audit trail available in inventory system'"
    expected_result: "Complete per-product breakdown visible in modal"
    actual_result: ""
    status: PENDING
    notes: "Provides transparency - PM can verify what was actually received/paid"

  # AC8: Form Validation
  - id: TC-S19-017
    title: "Validation: Purchase Date is required"
    priority: P0
    preconditions:
      - "Update Stock Modal open"
    steps:
      - action: "Clear the Purchase Date field (delete current date)"
        expected: "Field becomes empty"
      - action: "Click 'Complete & Update Stock' button"
        expected: "Error toast: 'Purchase date is required'"
      - action: "Modal does NOT close"
        expected: "Still on Update Stock Modal"
      - action: "Stock NOT updated"
        expected: "No backend API call made"
    expected_result: "Cannot submit without purchase date"
    actual_result: ""
    status: PENDING
    notes: "Frontend validation before API call"

  - id: TC-S19-018
    title: "Validation: Received quantity must be non-negative integer"
    priority: P0
    preconditions:
      - "Update Stock Modal open"
    steps:
      - action: "Enter negative value in Received Qty (e.g., -5)"
        expected: "Field accepts input"
      - action: "Click 'Complete & Update Stock' button"
        expected: "Error toast: 'Item 1: Received quantity must be a non-negative whole number'"
      - action: "Change to decimal (e.g., 10.5)"
        expected: "Field accepts input"
      - action: "Click 'Complete & Update Stock' button"
        expected: "Error toast: 'Item 1: Received quantity must be a whole number'"
      - action: "Change to valid integer (e.g., 10)"
        expected: "Form accepts, continues to next validation"
    expected_result: "Only non-negative integers allowed for received quantity"
    actual_result: ""
    status: PENDING
    notes: "Prevents invalid stock entries"

  - id: TC-S19-019
    title: "Validation: Cost fields must be non-negative"
    priority: P1
    preconditions:
      - "Update Stock Modal open"
    steps:
      - action: "Enter negative value in Unit Cost (e.g., -50)"
        expected: "Field accepts input"
      - action: "Click 'Complete & Update Stock' button"
        expected: "Error toast: 'Item 1: Actual unit cost must be a non-negative number'"
      - action: "Change to valid value (e.g., 100)"
        expected: "Total cost recalculates correctly"
      - action: "Submit form"
        expected: "Validation passes for cost fields"
    expected_result: "Cost fields cannot be negative"
    actual_result: ""
    status: PENDING
    notes: "Business rule: costs cannot be negative"

integration_tests:
  - id: IT-S19-001
    title: "End-to-end workflow: Create → Approve → Complete"
    priority: P0
    scenario: |
      Complete workflow from request creation to stock update
    steps:
      1. "Login as Purchase Manager → Create 2-product purchase request → Submit"
      2. "Login as Admin → Approve the request"
      3. "Login as Purchase Manager → Update Stock with real data → Submit"
      4. "Verify request status = 'completed'"
      5. "Verify stock increased for both products"
      6. "Verify 2 inventory transactions created"
      7. "View request details → Verify completion summary displays"
    expected_result: "Complete workflow executes successfully with all data persisted"
    actual_result: ""
    status: PENDING

  - id: IT-S19-002
    title: "Stock reflects correctly in Shop (student view)"
    priority: P1
    scenario: |
      After stock update, verify students see updated stock
    steps:
      1. "Complete purchase request for Product A (+20 stock)"
      2. "Login as Student → Navigate to Shop"
      3. "Find Product A in shop"
      4. "Verify stock count shows updated value (previousStock + 20)"
      5. "If product was out of stock before, verify now 'In Stock' and can add to cart"
    expected_result: "Shop inventory reflects completed purchase requests immediately"
    actual_result: ""
    status: PENDING

