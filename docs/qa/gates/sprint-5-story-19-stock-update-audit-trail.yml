known_issues:
  - issue_id: "BUG-S19-001"
    title: "POST /complete endpoint returns 404 - Story 19 BLOCKED"
    description: "When submitting the Update Stock form via '✅ Complete & Update Stock' button, the frontend calls POST http://localhost:5001/api/v2/shop/admin/purchase-requests/{id}/complete which returns 404 Not Found. Backend route is defined in routes/v2/purchase-requests.js:115, controller method exists at purchaseRequestController.js:566, route mounted in server.js:95. Despite correct configuration, endpoint returns 404. All frontend UI (modal, form, validations, data display) working perfectly - only submission blocked. Tested with PR-003 (purchase@gmail.com). Filled supplier='ABC Suppliers Pvt Ltd', invoice='INV-2025-001', purchaseDate='2025-10-30', confirmed dialog, got error toast: 'Error updating stock'. Network log shows: POST .../690305239341aa17fb9662a0/complete => [404] Not Found."
    severity: "P0_CRITICAL_BLOCKER"
    status: "NEW"
    discovered_by: "QA Agent (Quinn)"
    discovered_date: "2025-10-30 13:51:31"
    affected_test_cases: ["TC-S19-010", "TC-S19-011", "TC-S19-012", "TC-S19-013", "TC-S19-014", "TC-S19-015", "TC-S19-016"]
    impact: "Story 19 cannot be tested beyond modal UI verification. Core functionality (stock update, audit trail, idempotency) completely blocked."
    reproduction_steps:
      - "1. Login as purchase@gmail.com"
      - "2. Navigate to Purchase → Shop Inventory"
      - "3. Click 📦 on approved request (PR-003)"
      - "4. Fill form: Supplier='ABC Suppliers Pvt Ltd', Invoice='INV-2025-001'"
      - "5. Click '✅ Complete & Update Stock'"
